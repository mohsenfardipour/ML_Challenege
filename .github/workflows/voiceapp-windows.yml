# Builds and tests the VoiceApp Windows exe on a clean Windows machine.
# The finished app is attached to each run as "VoiceApp-win64" (Actions tab -> run -> Artifacts).
name: VoiceApp Windows build

on:
  push:
    paths:
      - "VoiceApp/**"
      - ".github/workflows/voiceapp-windows.yml"
  workflow_dispatch:

concurrency:
  group: voiceapp-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write          # to attach the app zip to the release
    defaults:
      run:
        working-directory: VoiceApp
        shell: cmd
    env:
      VOICEAPP_NOPAUSE: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup (venv, packages, FFmpeg)
        run: setup.bat

      - name: Build (tests, PyInstaller, exe self-test)
        run: build.bat

      - name: GUI launch test of the exe
        run: |
          set "VOICEAPP_DATA_DIR=%RUNNER_TEMP%\smoke"
          start "" /wait dist\VoiceApp\VoiceApp.exe --smoke-test
          if errorlevel 1 (
            type "%RUNNER_TEMP%\smoke\logs\voiceapp.log"
            exit /b 1
          )
          type "%RUNNER_TEMP%\smoke\logs\voiceapp.log"

      - name: Get a Persian model and Persian test speech
        run: |
          curl -sSL -o model.zip https://github.com/mohsenfardipour/ML_Challenege/releases/download/voiceapp-2.0/whisper-large-fa-v1-ct2-int8.zip
          tar -xf model.zip -C %RUNNER_TEMP%
          .venv\Scripts\python.exe tools\get_persian_test_audio.py %RUNNER_TEMP%\fa --count 4 --name rec1

      - name: Speech-to-text test from source (Windows, real model)
        timeout-minutes: 15
        run: |
          set "VOICEAPP_DATA_DIR=%RUNNER_TEMP%\srcdata"
          .venv\Scripts\python.exe VoiceApp.py --stt-selftest %RUNNER_TEMP%\whisper-large-fa-v1 %RUNNER_TEMP%\fa\rec1.ogg %RUNNER_TEMP%\srcout %RUNNER_TEMP%\fa\rec1.txt
          set RC=%ERRORLEVEL%
          type "%RUNNER_TEMP%\srcout\stt_selftest_report.txt"
          exit /b %RC%

      - name: Speech-to-text test of the packaged exe (real model)
        timeout-minutes: 15
        shell: pwsh
        run: |
          $env:VOICEAPP_DATA_DIR = "$env:RUNNER_TEMP\sttdata"
          $p = Start-Process -FilePath dist\VoiceApp\VoiceApp.exe -PassThru -ArgumentList @(
            "--stt-selftest", "$env:RUNNER_TEMP\whisper-large-fa-v1", "$env:RUNNER_TEMP\fa\rec1.ogg",
            "$env:RUNNER_TEMP\sttout", "$env:RUNNER_TEMP\fa\rec1.txt")
          $done = $p.WaitForExit(600000)
          Get-Content "$env:RUNNER_TEMP\sttdata\logs\voiceapp.log" -ErrorAction SilentlyContinue
          if (-not $done) { $p.Kill(); Write-Error "The exe did not finish within 10 minutes"; exit 1 }
          Get-Content "$env:RUNNER_TEMP\sttout\stt_selftest_report.txt"
          exit $p.ExitCode

      - name: Report size
        shell: pwsh
        run: |
          $size = (Get-ChildItem dist\VoiceApp -Recurse | Measure-Object Length -Sum).Sum / 1MB
          "App folder size: {0:N0} MB" -f $size
          "Zip size: {0:N0} MB" -f ((Get-Item dist\VoiceApp-win64.zip).Length / 1MB)

      - name: Attach the app to the GitHub release
        if: github.ref == 'refs/heads/claude/nice-einstein-pkijf8'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          copy dist\VoiceApp-win64.zip dist\VoiceApp-2.0-win64.zip
          gh release upload voiceapp-2.0 dist\VoiceApp-2.0-win64.zip --clobber --repo ${{ github.repository }}

      - uses: actions/upload-artifact@v4
        with:
          name: VoiceApp-win64
          path: VoiceApp/dist/VoiceApp
          retention-days: 30
